<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Comic Sleuth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-styles">
  :root {
    --ground: #12151a;
    --surface: #1b1f26;
    --surface-2: #20252c;
    --ink: #e9eae4;
    --ink-muted: #9aa39c;
    --ink-faint: #6c766e;
    --line: #2a2f37;
    --accent: #d9a24b;
    --accent-strong: #f0be73;
    --accent-bg: #372c18;
    --good: #6fbe95;
    --good-bg: #1c3327;
    --warn: #e08a52;
    --warn-bg: #3a2418;
    --chip-bg: #262b25;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: var(--accent-bg); color: var(--accent-strong); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }

  .brand-bar {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 48px;
  }
  .brand-logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    flex: none;
    display: block;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .brand-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  header.masthead { margin-bottom: 40px; }
  .eyebrow {
    font-family: "Public Sans", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1.title {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.1rem, 4vw, 2.9rem);
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede {
    color: var(--ink-muted);
    max-width: 62ch;
    margin: 0 0 28px;
    font-size: 16px;
  }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 108px;
  }
  .stat .num {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    font-size: 11.5px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  section.sources { margin: 36px 0 44px; }
  .sources h2, .list h2, .addbook h2 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 14px;
  }
  .source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px;
  }
  .source-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
  }
  .source-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .source-card .sname { font-weight: 600; }
  .source-method { font-size: 11px; color: var(--ink-muted); line-height: 1.4; }
  .status-pill {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex: none;
  }
  .status-pill.green { background: var(--good-bg); color: var(--good); }
  .status-pill.yellow { background: var(--accent-bg); color: var(--accent-strong); }
  .status-pill.red { background: var(--warn-bg); color: var(--warn); }
  .src-status-dot {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px; vertical-align: 1px;
    flex: none;
  }
  .src-status-dot.green { background: var(--good); }
  .src-status-dot.yellow { background: var(--accent); }
  .src-status-dot.red { background: var(--warn); }
  .source-summary { font-size: 13.5px; color: var(--ink); margin: 2px 0 4px; font-weight: 500; }
  .source-check-summary { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; }

  .list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 44px; }

  .book-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .book-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    flex-wrap: wrap;
  }
  .book-head-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .book-cover {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex: none;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    background: var(--surface-2);
  }
  .book-cover-placeholder {
    background-image: repeating-linear-gradient(45deg, var(--chip-bg), var(--chip-bg) 6px, var(--surface-2) 6px, var(--surface-2) 12px);
  }
  .book-titling { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .book-title {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 19px;
  }
  .book-issue {
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--accent-strong);
  }
  .book-meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-left: 2px;
  }
  .age-pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 7px;
    vertical-align: 1px;
  }
  .age-pill.golden { background: #d6ad3f; color: #3c2c07; }
  .age-pill.silver { background: #b9c2c9; color: #262b2f; }
  .age-pill.bronze { background: #8a5a2e; color: #fbeee0; }
  .age-pill.copper { background: #b56a3a; color: #fdf0e6; }
  .age-pill.modern { background: #3465d4; color: #f2f6ff; }
  .count-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .count-pill.found { background: var(--good-bg); color: var(--good); }
  .count-pill.empty { background: var(--chip-bg); color: var(--ink-muted); }
  .count-pill.pending { background: var(--accent-bg); color: var(--accent-strong); }

  table.listings {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.listings th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 6px 20px;
    border-top: 1px solid var(--line);
  }
  table.listings td {
    padding: 10px 20px;
    border-top: 1px solid var(--line);
    vertical-align: top;
  }
  table.listings tr:hover td { background: var(--surface-2); }
  .src-chip {
    display: inline-block;
    background: var(--chip-bg);
    color: var(--ink);
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .price {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }
  .price.tbd { color: var(--ink-faint); font-weight: 400; font-style: italic; }
  .grade { color: var(--ink-muted); white-space: nowrap; }
  .note { color: var(--ink-faint); font-size: 12px; }
  .newpill {
    display: inline-block;
    background: var(--good-bg);
    color: var(--good);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .facsimile {
    display: inline-block;
    background: var(--warn-bg);
    color: var(--warn);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .soldpill {
    display: inline-block;
    background: var(--chip-bg);
    color: var(--ink-muted);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: 1px;
  }
  tr.sold-row td { opacity: 0.55; }
  tr.sold-row .view-link { color: var(--ink-faint); }
  .view-link {
    color: var(--accent-strong);
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .view-link:hover { text-decoration: underline; }
  .empty-row {
    padding: 16px 20px;
    color: var(--ink-faint);
    font-size: 13.5px;
    font-style: italic;
  }
  .remove-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 4px 8px;
  }
  .remove-btn:hover { color: var(--warn); }
  .book-head-right { display: flex; align-items: center; gap: 8px; }

  .sort-wrap { position: relative; display: inline-flex; align-items: center; }
  .sort-select {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 22px 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-muted);
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
  }
  .sort-select:hover { color: var(--ink); border-color: var(--accent); }
  .sort-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sort-wrap::after {
    content: '▾';
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  .addbook {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
  }
  .addbook form {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label {
    font-size: 11.5px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input, .field select {
    font: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    width: 100%;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .add-submit {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-submit:hover { background: var(--accent-strong); }
  .add-submit:disabled { opacity: 0.6; cursor: default; }
  .addbook-hint { color: var(--ink-faint); font-size: 12.5px; margin-top: 10px; }

  .restricted-note { color: var(--warn); }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--ground);
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12.5px;
    line-height: 1.7;
  }

  @media (max-width: 640px) {
    .wrap { padding: 28px 16px 64px; }

    .brand-bar { gap: 14px; margin-bottom: 32px; }
    .brand-logo { width: 56px; height: 56px; border-radius: 14px; }
    .brand-name { font-size: 26px; }

    header.masthead { margin-bottom: 28px; }
    .lede { font-size: 14.5px; }

    .stat { min-width: 0; flex: 1 1 calc(50% - 5px); padding: 9px 12px; }

    .book-head { padding: 14px 16px; gap: 10px; }
    .book-head-right { width: 100%; justify-content: space-between; }
    .book-cover, .book-cover-placeholder { width: 48px; height: 48px; }
    .book-title, .book-issue { font-size: 17px; }

    .addbook { padding: 18px 16px; }
    .addbook form { grid-template-columns: 1fr 1fr; gap: 10px; }
    .addbook form .add-submit { grid-column: 1 / -1; }
    table.listings, table.listings tbody,
    table.listings td, table.listings tr {
      display: block;
      width: 100%;
    }
    table.listings thead { display: none; }
    table.listings tr {
      border-top: 1px solid var(--line);
      padding: 10px 20px 12px;
    }
    table.listings tr:first-child { border-top: none; }
    table.listings td {
      border-top: none;
      padding: 3px 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    table.listings td::before {
      content: attr(data-label);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-faint);
      flex: none;
    }
    table.listings td.note { align-items: flex-start; text-align: right; }
    table.listings td:last-child::before { content: ''; }
    table.listings td:last-child { justify-content: flex-end; }
    .empty-row { padding: 14px 20px; }

    .list-head { flex-direction: column; align-items: flex-start; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .list-head h2 { margin: 0; }
  .title-filter-wrap { display: flex; align-items: center; gap: 8px; }
  .title-filter-label {
    font-size: 12.5px;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .admin-panel {
    margin: 20px 0 44px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .admin-panel summary {
    cursor: pointer;
    list-style: none;
    padding: 16px 20px;
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .admin-panel summary::-webkit-details-marker { display: none; }
  .admin-panel summary::after {
    content: '+';
    font-family: "Public Sans", sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .admin-panel[open] summary::after { content: '\2212'; }
  .admin-panel-body { padding: 2px 20px 20px; }
  .admin-panel-body h3 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 24px 0 10px;
  }
  .health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .health-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .health-name { font-weight: 600; }
  .health-stat { color: var(--ink-muted); font-size: 11.5px; }
  .health-flag {
    display: inline-block;
    align-self: flex-start;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 2px;
  }
  .health-flag.ok { background: var(--good-bg); color: var(--good); }
  .health-flag.warn { background: var(--warn-bg); color: var(--warn); }
  .log-hint { color: var(--ink-faint); font-size: 12px; margin: 0 0 8px; }
  .log-empty { color: var(--ink-faint); font-size: 13px; }
  .cache-badge {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .cache-badge.hit { background: var(--good-bg); color: var(--good); }
  .cache-badge.miss { background: var(--chip-bg); color: var(--ink-muted); }

  @media (max-width: 640px) {
    .admin-panel summary { padding: 14px 16px; font-size: 13px; }
    .admin-panel-body { padding: 2px 16px 16px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p style="color:var(--ink-faint)">Loading…</p></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
